[env:esp32c3]
platform = espressif32@7.1.1
board = esp32-c3-devkitc-02
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_src_filter = +<main.cpp>

# I2C 扫描测试环境：只编译 src/scan.cpp，用于确认 4 针 OLED 地址与接线
# 打开 USB CDC，让 Serial 走 ESP32-C3 内置 USB（/dev/ttyACM0）而不是 UART0
[env:scan]
platform = espressif32@7.1.1
board = esp32-c3-devkitc-02
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_src_filter = +<scan.cpp>
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
